[project]
name = "fer"
version = "0.2.0"
description = "Real-time facial emotion recognition: FER+ training pipeline, ONNX export, and a webcam app."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "rebantamandal" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "timm>=1.0.29",
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
fer = "fer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fer"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
